    channel_id: "UC_57DMC_PLACEHOLDER"
  spotify:
    artist_id: "SPOTIFY_ARTIST_57DMC_PLACEHOLDER"

capabilities:
  - adn_completeness_guard
  - campaign_calendar_check
  - instagram_insights
  - youtube_insights
  - spotify_artist_pulse
  - insights_digest
  - market_trends_scan:
      subreddits: [ChristianRap, Christianity, Christian, Music]
      focus: "tendencias de música cristiana, colaboraciones, eventos de ministerio y contenido doctrinal urbano"
      limit: 8
  - instagram_content_ideas:
      variants: 3
      formats: [reel, carrusel, story]
      objective: "empujar escucha en Spotify/YouTube, donaciones vía PayPal e invitaciones a eventos/iglesias — nunca vender producto"
      cta_options: [spotify_link, youtube_link, paypal_donation, whatsapp_channel]
