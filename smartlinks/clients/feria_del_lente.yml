      - { label: "La Chorrera", note: "Frente a Ecomoda", href: "https://www.google.com/maps/search/?api=1&query=%C3%93ptica%20Feria%20del%20Lente%20La%20Chorrera%20frente%20a%20Ecomoda" }
      - { label: "Nuevo Arraiján", note: "Frente a Hopsa", href: "https://www.google.com/maps/search/?api=1&query=%C3%93ptica%20Feria%20del%20Lente%20Nuevo%20Arraij%C3%A1n%20frente%20a%20Hopsa" }

