# Óptica Feria del Lente — SmartLink.
# Fuente de marca: Feria del lente/01_ADN_y_Memoria/01_brand_guidelines.md
#   §2 paleta verificada (#D91B19 oxblood / #C5A059 dorado / negro / crema ≈#F2EDE4)
#   §2 tipografía: Oswald titulares + Montserrat cuerpo · §0 sucursales y WhatsApp por sucursal
#
# ⚠️ Regla de oro del ADN: la marca tiene DOS CARAS y no se mezclan. Esta landing es
# superficie consumer (link-in-bio de redes), así que el tagline usa el posicionamiento
# cristiano. El botón B2B ("Convenios para empresas") va con copy estrictamente
# corporativo y abre el WhatsApp de alianzas de Nelson Muñoz — sin lenguaje religioso.
#
# Decisiones tomadas (el cliente no dio destinos como D'CASA):
#   · Catálogo → no hay catálogo Canva/PDF; manda a la web propia.
#   · Ubicación → 3 sucursales. Los enlaces son BÚSQUEDAS de Google Maps armadas con la
#     dirección verificada del ADN, no place-ids inventados. Reemplazar por el link real
#     de cada ficha de Google Business cuando el cliente lo pase.
#   · Sin archivo de logo en el repo → monograma "FL" (isotipo real del ADN) hasta que lo suba.

id: feria_del_lente
folder: "Feria del lente"
slug: feria-del-lente
enabled: true
name: "Óptica Feria del Lente"
shortName: "Feria del Lente"
handle: "@opticaferiadellente"
tagline: "La primera óptica cristiana de Panamá · tus lentes en 40 minutos."
description: "Lentes graduados, aros y lentes de sol en 40 minutos. Tres sucursales en Panamá y Panamá Oeste. Agenda tu examen visual."

monogram: "FL"

theme:
  mode: light
  bg: "#F2EDE4"          # crema hueso del registro consumer
  bgAlt: "#FBF8F3"
  hero: "#D91B19"        # oxblood, color primario
  onHero: "#FFFFFF"
  surface: "#FFFFFF"
  text: "#151515"
  muted: "#6E6559"
  border: "#E3DACB"
  primary: "#D91B19"
  onPrimary: "#FFFFFF"
  accent: "#C5A059"      # dorado premium
  onAccent: "#1A1A1A"
  accentOutline: "#B08C45"
  baseBand: "#C5A059"
  radius: 12
  fonts:
    display: "Oswald"
    body: "Montserrat"
    displayUppercase: true
    displayTracking: "0.005em"
    google: ["Oswald:wght@500;600;700", "Montserrat:wght@400;500;600;700"]

buttons:
