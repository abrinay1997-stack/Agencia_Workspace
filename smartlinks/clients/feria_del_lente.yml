    label: "Escríbenos por WhatsApp"
    note: "Elegí tu sucursal"
    icon: whatsapp
    variant: primary
    items:
      - { label: "Ciudad de Panamá · 6544-5656", href: "https://wa.me/50765445656?text=Hola%20Feria%20del%20Lente%2C%20vengo%20de%20su%20p%C3%A1gina%20de%20enlaces.%20Quiero%20informaci%C3%B3n." }
      - { label: "La Chorrera · 6554-6752", href: "https://wa.me/50765546752?text=Hola%20Feria%20del%20Lente%2C%20vengo%20de%20su%20p%C3%A1gina%20de%20enlaces.%20Quiero%20informaci%C3%B3n." }
      - { label: "Nuevo Arraiján · 6445-3379", href: "https://wa.me/50764453379?text=Hola%20Feria%20del%20Lente%2C%20vengo%20de%20su%20p%C3%A1gina%20de%20enlaces.%20Quiero%20informaci%C3%B3n." }

  - kind: link
    label: "Agendá tu cita"
