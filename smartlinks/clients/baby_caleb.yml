    label: "Haz tu pedido por WhatsApp"
    note: "+507 6757-5065"
    icon: whatsapp
    variant: accent
    href: "https://wa.me/50767575065?text=Hola%20Baby%20Caleb%2C%20vengo%20de%20su%20p%C3%A1gina%20de%20enlaces.%20Quiero%20hacer%20un%20pedido."

  - kind: menu
    label: "Catálogo"
