      - { label: "Wipes hipoalergénicos", href: "https://wa.me/50767575065?text=Hola%20Baby%20Caleb%2C%20quiero%20informaci%C3%B3n%20de%20los%20wipes%20hipoalerg%C3%A9nicos." }
      - { label: "Fulares Moon · porteo", href: "https://wa.me/50767575065?text=Hola%20Baby%20Caleb%2C%20quiero%20informaci%C3%B3n%20de%20los%20fulares%20Moon." }

  - kind: link
    label: "¿Llegan a mi zona?"
    note: "Entregamos en todo Panamá"
    icon: location
    href: "https://wa.me/50767575065?text=Hola%20Baby%20Caleb%2C%20%C2%BFhacen%20entrega%20en%20mi%20zona%3F%20Estoy%20en%3A"

  - kind: link
    label: "Caja para el mes completo"
    note: "Sale más a cuenta que por paquete"
