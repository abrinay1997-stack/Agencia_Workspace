# 57DMC (Juan Arrieta) — SmartLink.
# Fuente de marca: 57Dmc/01_ADN_y_Memoria/01_brand_guidelines.md
#   §2 paleta ESTIMADA (negro + dorado/ámbar + blanco) — ⏳ HEX exactos pendientes de que
#   el cliente pase el archivo de marca. Los valores de abajo son los del manifiesto del
#   agente (#1A1A1A / #D4AF37) para que todo el sistema use el mismo estimado.
#   §2 tipografía estimada: condensada mayúsculas tipo póster → Anton + Inter de cuerpo.
#   §5 canales oficiales (Spotify, YouTube, Apple Music, Deezer, PayPal).
#
# Decisiones tomadas (es artista/ministerio, no negocio de producto):
#   · No hay catálogo ni precios → el desplegable es "Escucha mi música" con las
#     plataformas reales listadas en el ADN.
#   · No hay punto de venta → el equivalente de "ubicación" es invitaciones a eventos.
#   · ⏳ El +507 6840-0144 figura en el ADN como teléfono de contacto; asumimos que es
#     WhatsApp (celular panameño). Confirmar con Juan antes de difundir la landing.
#   · Sin archivo de logo en el repo → monograma "57".

